<div class="kiosk-screen">
  <div class="kiosk-card">
    <button type="button" class="btn-big btn-back btn-back-top" (click)="back()">← {{ 'common.back' | translate }}</button>

    <h1 class="kiosk-title">{{ 'department.title' | translate }}</h1>
    <p class="kiosk-sub">{{ 'department.subtitle' | translate }}</p>

    <div class="dept-grid">
      <button
        type="button"
        class="dept-btn"
        *ngFor="let department of departments"
        (click)="choose(department)"
      >
        <span class="dept-icon" aria-hidden="true">{{ department.icon }}</span>
        <span class="dept-name">{{ ('dept.' + department.id + '.name') | translate }}</span>
        <span class="dept-blurb">{{ ('dept.' + department.id + '.blurb') | translate }}</span>
      </button>
    </div>
  </div>
</div>
