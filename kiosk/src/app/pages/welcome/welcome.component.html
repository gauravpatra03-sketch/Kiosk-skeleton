<div class="kiosk-screen">
  <div class="kiosk-card">
    <div class="welcome-top">
      <span class="welcome-date">{{ dateLabel() }}</span>
      <span class="welcome-clock">{{ clock }}</span>
    </div>

    <div class="welcome-icon" aria-hidden="true">🏥</div>
    <h1 class="kiosk-title">{{ 'welcome.title' | translate }}</h1>
    <p class="kiosk-sub">
      {{ 'welcome.subtitle' | translate }}
    </p>

    <button type="button" class="btn-big btn-start" (click)="start()">
      ▶ &nbsp; {{ 'welcome.begin' | translate }}
    </button>

    <p class="hint welcome-help">
      {{ 'welcome.help' | translate }}
    </p>
  </div>
</div>
