<div class="kiosk-screen">
  <div class="kiosk-card">
    <button type="button" class="btn-big btn-back btn-back-top" (click)="back()">← {{ 'common.back' | translate }}</button>

    <h1 class="kiosk-title">{{ 'details.title' | translate }}</h1>
    <p class="kiosk-sub">{{ 'details.subtitle' | translate }}</p>

    <form (ngSubmit)="next()">
      <div class="field">
        <label for="name">{{ 'details.nameLabel' | translate }}</label>
        <input
          id="name"
          name="name"
          type="text"
          [(ngModel)]="name"
          autocomplete="name"
          [placeholder]="'details.namePh' | translate"
          required
        />
      </div>

      <div class="field">
        <label for="phone">{{ 'details.phoneLabel' | translate }}</label>
        <input
          id="phone"
          name="phone"
          type="tel"
          inputmode="numeric"
          [(ngModel)]="phone"
          (input)="onPhoneInput()"
          autocomplete="tel"
          [placeholder]="'details.phonePh' | translate"
          maxlength="10"
          required
        />
      </div>

      <p *ngIf="hasInputError()" class="form-error">
        {{ 'details.error' | translate }}
      </p>

      <button type="submit" class="btn-big btn-primary btn-submit">{{ 'common.next' | translate }} →</button>
    </form>
  </div>
</div>
