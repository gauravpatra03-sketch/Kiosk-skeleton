<header class="kiosk-header">
  <div class="brand">
    <span class="brand-dot" aria-hidden="true"></span>
    <div class="brand-text">
      <h1 class="brand-name">{{ 'header.brandName' | translate }}</h1>
      <p class="brand-tag">{{ 'header.brandTag' | translate }}</p>
    </div>
  </div>

  <div class="kiosk-nav">
    <div class="step-progress" *ngIf="activeStep >= 0" aria-label="Journey progress">
      <span
        *ngFor="let step of steps; let i = index"
        class="step"
        [class.step-active]="i === activeStep"
        [class.step-done]="i < activeStep"
        [attr.aria-current]="i === activeStep ? 'step' : null"
        [title]="step.labelKey | translate"
      ><span class="step-ico" aria-hidden="true">{{ step.icon }}</span></span>
    </div>

    <div class="lang-toggle" role="group" aria-label="Language">
      <button
        type="button"
        class="lang-btn"
        [class.lang-active]="lang === 'en'"
        (click)="setLang('en')"
        [attr.aria-pressed]="lang === 'en'"
      >EN</button>
      <button
        type="button"
        class="lang-btn"
        [class.lang-active]="lang === 'hi'"
        (click)="setLang('hi')"
        [attr.aria-pressed]="lang === 'hi'"
      >हिं</button>
    </div>

    <span class="help-chip" title="A member of staff can help you use the kiosk">
      🛟 {{ 'header.help' | translate }}
    </span>

    <button type="button" class="btn-home" (click)="goHome()">🏠 {{ 'header.home' | translate }}</button>
  </div>
</header>

<main class="kiosk-main">
  <router-outlet></router-outlet>
</main>
